name: ZAP baseline

# LL-N04: OWASP ZAP passive baseline scan of the running app (console, API, docs). Fails on any High alert; accepted
# Low and informational findings are listed, with reasons, in .zap/rules.tsv. Weekly and on demand.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: zap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack and wait for health
        run: docker compose up --build --wait --wait-timeout 300

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

      - name: No High alerts
        run: |
          high=$(python3 -c 'import json; d=json.load(open("report_json.json")); print(sum(1 for s in d.get("site", []) for a in s.get("alerts", []) if str(a.get("riskcode")) == "3"))')
          echo "High alerts: $high"
          if [ "$high" != "0" ]; then echo "::error::ZAP reported $high High alert(s)"; exit 1; fi

      - name: Stop the stack
        if: always()
        run: docker compose down -v
