name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing "api-break-approved" re-runs the OpenAPI check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests, Testcontainers integration tests (Docker is available on ubuntu runners),
      # Spotless check, JaCoCo report + gate, CycloneDX SBOM.
      - name: Verify
        run: ./mvnw -B -ntp verify

      # OpenApiDocIT (LL-C01) regenerates docs/openapi.json during verify. The committed file must match it.
      - name: OpenAPI document is up to date
        run: |
          if ! git diff --exit-code -- docs/openapi.json; then
            echo "::error file=docs/openapi.json::docs/openapi.json is stale. Run ./mvnw verify and commit the result."
            exit 1
          fi

      # LL-C01: fail the PR if the API breaks backward compatibility against the base branch, unless a maintainer
      # labelled the PR "api-break-approved" (AGENTS.md, API contract). The report is printed either way.
      - name: OpenAPI breaking-change check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-break-approved') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if ! git cat-file -e FETCH_HEAD:docs/openapi.json 2>/dev/null; then
            echo "::notice::$BASE_REF has no docs/openapi.json yet; nothing to compare against."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/openapi"
          git show FETCH_HEAD:docs/openapi.json > "$RUNNER_TEMP/openapi/base.json"
          cp docs/openapi.json "$RUNNER_TEMP/openapi/head.json"
          if docker run --rm -v "$RUNNER_TEMP/openapi:/specs:ro" \
            openapitools/openapi-diff:2.1.7@sha256:82291446e5554742d9c0725d7b315d18e93958c5526f9a663e8885227bdd6cb6 \
            /specs/base.json /specs/head.json --fail-on-incompatible; then
            exit 0
          fi
          if [ "$BREAK_APPROVED" = "true" ]; then
            echo "::warning::Backward-incompatible API change, approved with the api-break-approved label."
            exit 0
          fi
          echo "::error::Backward-incompatible API change. Add a new API version, or have a maintainer label the PR api-break-approved."
          exit 1

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: ledgerline-api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            ledgerline-api/target/surefire-reports/
            ledgerline-api/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      # LL-N05: the CycloneDX SBOM of this build (also attached to GitHub releases by release-sbom.yml).
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ledgerline-api/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

  ops-console:
    name: ops-console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops-console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: ops-console/package-lock.json

      # npm 10 (bundled with Node 22) fails to resolve this tree; the Maven build pins the same npm.
      - name: Install npm 11.21.2
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest, Testing Library, MSW)
        run: npm test

      - name: Build
        run: npm run build

      # LL-N08: the evidence assembler against fixture reports (no dependencies, Node's own test runner).
      - name: Evidence assembler tests
        run: node --test ../evidence/assemble.test.mjs

      # The API client types are generated from docs/openapi.json and committed; they must match it.
      - name: Generated API types are up to date
        run: |
          npm run generate:api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error file=ops-console/src/api/schema.d.ts::Stale API types. Run npm run generate:api and commit the result."
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image builds the jar with the console inside (Maven downloads the pinned Node and npm).
      - name: Start the stack (PostgreSQL + app) and wait for health
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build --wait --wait-timeout 300

      # Same pinned Playwright image as local runs, so screenshots match the committed Linux baselines.
      - name: Playwright (LL-E01..LL-E07)
        run: ops-console/scripts/e2e-docker.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ops-console/playwright-report/
            ops-console/test-results/
            ops-console/results/
          if-no-files-found: warn
          retention-days: 14

      # LL-N05: the image compose just built, scanned for known vulnerabilities. CRITICAL fails the build.
      - name: Trivy image scan
        if: always()
        run: |
          mkdir -p trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/trivy:/out" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --format json --output /out/trivy.json --scanners vuln ledgerline-api:local
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln --severity CRITICAL,HIGH --exit-code 0 ledgerline-api:local
          critical=$(python3 -c 'import json; r=json.load(open("trivy/trivy.json")).get("Results") or []; print(sum(1 for x in r for v in (x.get("Vulnerabilities") or []) if v["Severity"]=="CRITICAL"))')
          echo "CRITICAL vulnerabilities: $critical"
          if [ "$critical" != "0" ]; then echo "::error::Trivy found $critical CRITICAL vulnerabilities"; exit 1; fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy
          path: trivy/trivy.json
          if-no-files-found: warn
          retention-days: 30

      - name: App logs on failure
        if: failure()
        run: docker compose logs app --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  # Evidence for the website: every number parsed from a report produced by CI, null when not measured.
  # Published to GitHub Pages (gh-pages branch): /evidence/latest.json plus the HTML reports.
  evidence:
    name: evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, ops-console, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: evidence-pages
      cancel-in-progress: false
    permissions:
      contents: write # push to gh-pages
      actions: read # artifacts of the load-test and ZAP workflows
      security-events: read # open CodeQL alerts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download this run's reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports

      # LL-N02: about a minute, so the score is measured for exactly this commit (also nightly in mutation.yml).
      - name: Mutation testing (PIT)
        run: ./mvnw -B -ntp -Pmutation -Dskip.frontend test-compile pitest:mutationCoverage

      - name: Latest load test, ZAP scan and CodeQL result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: evidence/fetch-external.sh

      - name: Assemble evidence/latest.json
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node evidence/assemble.mjs --out latest.json --repo "$REPO" --sha "$SHA" \
            --surefire reports/test-reports/surefire-reports \
            --failsafe reports/test-reports/failsafe-reports \
            --playwright reports/playwright-report/results/junit.xml \
            --jacoco reports/jacoco-report/jacoco.xml \
            --pit ledgerline-api/target/pit-reports/mutations.xml \
            --k6 external/k6/summary.json --k6-environment "$(cat external/k6/environment.txt 2>/dev/null)" \
            --trivy reports/trivy/trivy.json \
            --zap external/zap/report_json.json \
            --codeql "$(cat external/codeql.txt 2>/dev/null)" \
            --sbom-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/evidence/bom.json" \
            --source-urls "$(cat external/sources.json 2>/dev/null || echo '{}')"

      - name: Publish to GitHub Pages (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: evidence/publish.sh

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
