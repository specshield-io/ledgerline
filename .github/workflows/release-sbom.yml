name: Release

# Pushing a tag vX.Y.Z creates the GitHub release: notes from that version's CHANGELOG.md section, plus the
# CycloneDX SBOM (bom.json) of the tagged commit (LL-N05). Re-running the workflow updates the existing release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its asset
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section in CHANGELOG.md. Add it before tagging."
            exit 1
          fi
          cat release-notes.md

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the SBOM
        run: |
          ./mvnw -B -ntp -DskipTests package
          cp ledgerline-api/target/classes/META-INF/sbom/application.cdx.json bom.json

      - name: Create or update the release, attach bom.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Ledgerline ${TAG}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" bom.json --clobber -R "$GITHUB_REPOSITORY"
