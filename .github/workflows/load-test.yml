name: Load test

# LL-N01: k6 at 200 signed webhook deliveries/s (20 % duplicates) against docker compose on a GitHub-hosted runner,
# then a database check that every event was applied at most once. On demand only: it takes about 5 minutes and its
# numbers describe this runner, not production hardware.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: "Requests per second at the plateau"
        default: "200"
      hold:
        description: "Plateau duration (k6 duration, e.g. 2m)"
        default: "2m"

permissions:
  contents: read

jobs:
  load:
    name: load
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack and wait for health
        run: docker compose -f docker-compose.yml -f docker-compose.perf.yml up --build --wait --wait-timeout 300

      - name: Record the environment
        run: |
          echo "GitHub-hosted runner ($ImageOS), $(nproc) vCPU, $(free -g | awk '/Mem:/ {print $2}') GB RAM, docker compose" \
            | tee perf/results/environment.txt

      - name: k6 (LL-N01) and database check
        env:
          RATE: ${{ inputs.rate }}
          HOLD: ${{ inputs.hold }}
        run: perf/run.sh

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-results
          path: |
            perf/results/summary.json
            perf/results/verify.json
            perf/results/environment.txt
          if-no-files-found: warn
          retention-days: 90

      - name: App logs on failure
        if: failure()
        run: docker compose logs app --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.perf.yml down -v
