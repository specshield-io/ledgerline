# Ledgerline: SpecShield Labs internal demonstration. Synthetic data only.
spring:
  application:
    name: ledgerline
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      # Boot 4 enables liveness/readiness groups by default, which adds a "groups" key to the response.
      # Keep the public body exactly {"status":"UP"}; re-enable when deploying to Kubernetes.
      probes:
        enabled: false
  info:
    env:
      enabled: false

springdoc:
  # Set explicitly: springdoc warns at startup when these are left to their defaults.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # Deterministic output, so the committed docs/openapi.json only changes when the API does.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json

logging:
  level:
    # Spring logs every client 405/404-for-handler at WARN here. Client mistakes are not server warnings;
    # they are visible in the request log line and the problem response.
    org.springframework.web.servlet.PageNotFound: error
  pattern:
    # Every log line carries the request's correlation id (X-Request-Id), set by CorrelationIdFilter.
    correlation: "[%X{correlationId:-}] "

ledgerline:
  idempotency:
    # Hourly purge of expired idempotency keys (UTC). "-" disables it.
    cleanup-cron: "0 0 * * * *"
  mockpay:
    # The payment-provider simulator. Off unless a profile enables it (local does).
    enabled: false
    webhook-url: "http://localhost:${server.port:8080}/webhooks/mockpay"
    default-outcome: PAYMENT_SUCCEEDED
    min-delay: 300ms
    max-delay: 800ms
    max-delivery-attempts: 5
    retry-backoff: 250ms
  webhook:
    mockpay:
      tolerance: 300s
      orphan-retry-window: 1h
      orphan-cron: "*/30 * * * * *"
  reconciliation:
    cron: "0 */5 * * * *"
    # Payments settled more recently than this are skipped: their webhook may still be in flight.
    grace: 2m
  outbox:
    # Relay of merchant notifications (docs/adr/0003-transactional-outbox.md).
    dispatcher-enabled: true
    poll-interval: 500ms
    batch-size: 20
    backoff-base: 2s
    backoff-cap: 1h
    max-attempts: 8
    # IN_FLIGHT rows older than this are returned to PENDING (crash recovery). Keep well above connect + request timeout.
    stuck-after: 60s
    watchdog-interval: 10s
  merchant:
    connect-timeout: 2s
    request-timeout: 3s
    sink:
      # The built-in demo merchant at /demo/merchant-sink. Off unless a profile enables it.
      enabled: false
  rate-limit:
    # Per client IP, in memory, per instance. 429 + Retry-After when exceeded.
    enabled: true
    public-per-minute: 60
    chaos-per-minute: 10
    # CIDRs of our own reverse proxies; X-Forwarded-For is trusted only from them. Empty: use the TCP peer address.
    trusted-proxies: []
  chaos:
    max-concurrent-runs: 3
    merchant-outage: 2m
    merchant-slow-delay: 10s
    await-timeout: 15s
  demo:
    seed-on-startup: true
    # Wipe and reseed the demo data (UTC). "-" disables it.
    reset-cron: "0 0 3 * * *"
    data-resets-at: "03:00 UTC"
    # Set by the image build (Dockerfile ARG GIT_SHA); "unknown" otherwise.
    git-sha: ${LEDGERLINE_GIT_SHA:unknown}
  security:
    cors-allowed-origins:
      - "https://www.specshield.example"

info:
  app:
    name: ledgerline
    notice: SpecShield Labs internal demonstration. Synthetic data only.

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # Local development only. These credentials guard a throwaway container holding synthetic data.
    url: ${LEDGERLINE_DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${LEDGERLINE_DB_USER:ledgerline}
    password: ${LEDGERLINE_DB_PASSWORD:ledgerline}
ledgerline:
  mockpay:
    enabled: true
    # Local development only: synthetic secrets for a simulator talking to itself. Not secrets.
    signing-secrets:
      - "local-dev-only-mockpay-signing-secret-0001"
  webhook:
    mockpay:
      secrets:
        - "local-dev-only-mockpay-signing-secret-0001"
  merchant:
    # Local development only: notifications go to the built-in demo merchant. Synthetic secret, not a secret.
    url: "http://localhost:${server.port:8080}/demo/merchant-sink"
    signing-secrets:
      - "local-dev-only-merchant-signing-secret-0001"
    sink:
      enabled: true
      secrets:
        - "local-dev-only-merchant-signing-secret-0001"
  security:
    # Local development only: synthetic accounts. Passwords: local-dev-only-admin-password and
    # local-dev-only-viewer-password. Never use these hashes anywhere else.
    users:
      - username: local-admin
        password-hash: "$2a$10$KvYxBa2sOjaup3EsPUpm5OrLWPQ1f44bMJLb9w..OS3Ag82yDfpPW"
        role: ADMIN
      - username: local-viewer
        password-hash: "$2a$10$pdKyhonCpn0d.qyIxsA81.Q9/tWl4gpuOFZ.mFrtuaKvJtVJ/Ewuu"
        role: VIEWER
    cors-allowed-origins:
      - "https://www.specshield.example"
      - "http://localhost:5173"
      - "http://localhost:3000"

---
spring:
  config:
    activate:
      on-profile: test
# The datasource is provided by Testcontainers through @ServiceConnection. Never H2.
ledgerline:
  idempotency:
    # Tests run the cleanup job explicitly, with a controllable clock.
    cleanup-cron: "-"
  mockpay:
    enabled: false
    webhook-url: "http://localhost:${local.server.port}/webhooks/mockpay"
    signing-secrets:
      - "test-only-mockpay-signing-secret-current-0001"
    retry-backoff: 50ms
  webhook:
    mockpay:
      # Two secrets: the receiver accepts either (rotation). Synthetic test values.
      secrets:
        - "test-only-mockpay-signing-secret-current-0001"
        - "test-only-mockpay-signing-secret-previous-0002"
      orphan-cron: "-"
  reconciliation:
    cron: "-"
  outbox:
    # Tests run the dispatcher and the watchdog explicitly, with a controllable clock.
    dispatcher-enabled: false
  merchant:
    # Outbox tests point this at WireMock; the default is the built-in sink. Synthetic test secrets.
    url: "http://localhost:${local.server.port}/demo/merchant-sink"
    signing-secrets:
      - "test-only-merchant-signing-secret-current-0001"
    sink:
      enabled: true
      secrets:
        - "test-only-merchant-signing-secret-current-0001"
  rate-limit:
    # Off for the shared test context (hundreds of requests from 127.0.0.1); RateLimitIT turns it on.
    enabled: false
  demo:
    # Tests seed and reset explicitly.
    seed-on-startup: false
    reset-cron: "-"
  security:
    # Synthetic test accounts (BCrypt cost 4 keeps tests fast). Passwords: test-only-admin-password-0001 and
    # test-only-viewer-password-0001.
    users:
      - username: test-admin
        password-hash: "$2a$04$XL2.pLb4cJjro19RvoWyBeuzUhvhccUemPA9DEm7C8Kd4lB7CYJ8G"
        role: ADMIN
      - username: test-viewer
        password-hash: "$2a$04$.h08N2jWn3utEZVhuhaTf.PEHKzYJNkT9qgnNifLF3hH3oG0D5jq6"
        role: VIEWER
    cors-allowed-origins:
      - "https://www.specshield.example"
      - "http://localhost:5173"
logging:
  level:
    # Negative tests violate constraints on purpose; Hibernate would log each expected SQL error at WARN.
    # The tests assert the exception and constraint name instead. Other profiles keep these warnings.
    org.hibernate.orm.jdbc.error: error

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # No defaults: the application must fail fast if these are missing.
    url: ${LEDGERLINE_DB_URL}
    username: ${LEDGERLINE_DB_USER}
    password: ${LEDGERLINE_DB_PASSWORD}
springdoc:
  swagger-ui:
    enabled: false
ledgerline:
  webhook:
    mockpay:
      # Required, no default: startup fails without them. Comma separated; two during rotation.
      secrets: ${LEDGERLINE_MOCKPAY_WEBHOOK_SECRETS}
  merchant:
    # Required, no defaults: startup fails without them.
    url: ${LEDGERLINE_MERCHANT_URL}
    signing-secrets: ${LEDGERLINE_MERCHANT_SIGNING_SECRETS}
  security:
    # BCrypt hashes only, never passwords. The ADMIN account is required (startup fails without it); the VIEWER
    # account is optional (blank hash = no viewer).
    users:
      - username: ${LEDGERLINE_ADMIN_USERNAME}
        password-hash: ${LEDGERLINE_ADMIN_PASSWORD_HASH}
        role: ADMIN
      - username: ${LEDGERLINE_VIEWER_USERNAME:viewer}
        password-hash: ${LEDGERLINE_VIEWER_PASSWORD_HASH:}
        role: VIEWER
  rate-limit:
    # Comma-separated CIDRs of the Fly.io / Cloudflare proxies in front of the app. Unset: X-Forwarded-For ignored.
    trusted-proxies: ${LEDGERLINE_TRUSTED_PROXIES:}
